[package]
name = "omnicat-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "rt", "macros", "rt-multi-thread"] }
tokio-serial = "5.5.0"
utl = { git = "https://github.com/PortiaLabiata/utl.git" }
